<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mis métodos de pago</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css"><link rel="stylesheet" href="/css/style.css"></head><body class="store-body"><div th:replace="~{fragments/store-header :: storeHeader}"></div><main class="store-main"><div class="container"><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><h1 class="section-title mb-1">Mis métodos de pago</h1><p class="section-subtitle mb-0">Administra tus métodos de pago para futuras compras.</p></div><a href="/pedido/detalle" class="btn store-btn-outline">Volver al checkout</a></div><div th:if="${mensajePago}" class="alert-soft alert-success mb-4" th:text="${mensajePago}"></div><div class="row g-4"><div class="col-lg-6"><section class="payment-grid"><article class="payment-method-card" th:if="${#lists.isEmpty(metodosPago)}"><h2 class="mb-2">No hay métodos registrados</h2><p class="muted-copy mb-0">Agrega uno para que aparezca como opción al finalizar una compra.</p></article><article class="payment-method-card" th:each="metodo : ${metodosPago}"><div class="d-flex justify-content-between align-items-start gap-3"><div><span class="store-badge mb-2" th:text="${metodo.tipo}"></span><h3 class="product-title mb-1" th:text="${metodo.entidad}"></h3><p class="cart-preview-meta" th:text="${'Titular: ' + metodo.titular}"></p><p class="cart-preview-meta mb-0" th:text="${'Referencia: ' + metodo.referencia}"></p></div><a class="btn store-btn-outline" th:href="@{'/perfil/pagos/eliminar/' + ${metodo.id}}">Eliminar</a></div><div class="summary-box-note mt-3">Saldo disponible para simulación: <strong th:text="${'$ ' + #numbers.formatDecimal(metodo.saldoDisponible, 0, 'POINT', 0, 'COMMA')}"></strong></div></article></section></div><div class="col-lg-6"><section class="payment-form"><h2 class="mb-3">Agregar método</h2><form th:action="@{/perfil/pagos}" th:object="${metodoPagoForm}" method="post" class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Tipo</label><select th:field="*{tipo}"><option value="">Selecciona una opción</option><option th:each="tipo : ${tiposMetodoPago}" th:value="${tipo}" th:text="${tipo}"></option></select><small class="text-danger" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></small></div><div class="col-md-6"><label class="form-label fw-semibold">Entidad</label><input th:field="*{entidad}"><small class="text-danger" th:if="${#fields.hasErrors('entidad')}" th:errors="*{entidad}"></small></div><div class="col-md-6"><label class="form-label fw-semibold">Titular</label><input th:field="*{titular}"><small class="text-danger" th:if="${#fields.hasErrors('titular')}" th:errors="*{titular}"></small></div><div class="col-md-6"><label class="form-label fw-semibold">Referencia</label><input th:field="*{referencia}"><small class="text-danger" th:if="${#fields.hasErrors('referencia')}" th:errors="*{referencia}"></small></div><div class="col-12"><label class="form-label fw-semibold">Saldo disponible</label><input type="number" step="0.01" min="0" th:field="*{saldoDisponible}"><small class="text-danger" th:if="${#fields.hasErrors('saldoDisponible')}" th:errors="*{saldoDisponible}"></small></div><div class="col-12"><button class="btn store-btn-primary w-100">Guardar método</button></div></form></section></div></div></div></main><script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script></body></html>
