<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextLevel Store</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="intro-body">
    <div class="intro-overlay"></div>
    <header class="intro-topbar">
        <a href="/catalogo" class="btn intro-continue-btn">Continuar</a>
    </header>

    <main class="intro-stage">
        <section class="intro-card">
            <img src="/images/store/logo-nextlevel.png" alt="NextLevel Store" class="intro-logo">
            <p class="intro-kicker">Proyecto de aula 2026</p>
            <h1>Bienvenido a NextLevel Store</h1>
            <p class="intro-copy">Tienda digital con autenticación segura, registro tradicional, acceso con Google, JWT y panel de indicadores integrado.</p>
            <div class="intro-actions">
                <a href="/catalogo" class="btn store-btn-primary">Entrar a la tienda</a>
                <a href="/login" class="btn store-btn-outline">Iniciar sesión</a>
            </div>
        </section>
    </main>
</body>
</html>
