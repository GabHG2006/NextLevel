<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pedidos admin</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css"><link rel="stylesheet" href="/css/style.css"></head><body class="admin-body"><div class="admin-layout"><div th:replace="~{fragments/admin-header :: adminSidebar('pedidos')}"></div><main class="admin-content"><div class="admin-toolbar"><div><h1 class="admin-page-title mb-1">Gestión de pedidos</h1><p class="admin-muted mb-0">Controla estados, tracking y validación operativa.</p></div><a href="/admin/dashboard" class="btn store-btn-outline">Volver al dashboard</a></div><div th:if="${mensaje}" class="alert-soft alert-success mb-4" th:text="${mensaje}"></div><section class="admin-card" th:if="${#lists.isEmpty(pedidos)}"><p class="mb-0">No hay pedidos registrados todavía.</p></section><section class="admin-card" th:if="${!#lists.isEmpty(pedidos)}"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Estado</th><th>Tracking</th><th>Actualizar</th></tr></thead><tbody><tr th:each="pedido : ${pedidos}"><td><strong th:text="${pedido.id}"></strong><div class="admin-muted small" th:text="${#temporals.format(pedido.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></div></td><td><strong th:text="${pedido.nombreCliente}"></strong><div class="admin-muted small" th:text="${pedido.correoCliente}"></div></td><td th:text="${'$ ' + pedido.total}"></td><td><span class="tag-status success" th:text="${pedido.estadoPago}"></span><div class="admin-muted small" th:text="${pedido.metodoPagoTipo != null ? pedido.metodoPagoTipo + ' - ' + pedido.metodoPagoEntidad : 'Sin método'}"></div></td><td><span class="tag-status" th:text="${pedido.estado}"></span></td><td th:text="${pedido.trackingCode != null ? pedido.trackingCode : 'Sin asignar'}"></td><td><form class="inline-form" th:action="@{'/admin/pedidos/' + ${pedido.id} + '/actualizar'}" method="post"><select name="estado" required><option th:each="estado : ${estados}" th:value="${estado}" th:selected="${estado == pedido.estado}" th:text="${estado}"></option></select><input name="trackingCode" placeholder="Tracking" th:value="${pedido.trackingCode}"><button class="btn store-btn-primary py-2 px-3">Guardar</button></form></td></tr></tbody></table></div></section></main></div></body></html>
