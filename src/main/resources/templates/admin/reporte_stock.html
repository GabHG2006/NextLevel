<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stock bajo</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css"><link rel="stylesheet" href="/css/style.css"></head><body class="admin-body"><div class="admin-layout"><div th:replace="~{fragments/admin-header :: adminSidebar('stock')}"></div><main class="admin-content"><div class="admin-toolbar"><div><h1 class="admin-page-title mb-1">Reporte de stock bajo</h1><p class="admin-muted mb-0">Tabla de productos que necesitan reposición rápida.</p></div><a href="/admin/dashboard" class="btn store-btn-outline">Volver al dashboard</a></div><section class="admin-card"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(productos)}"><td colspan="4">No hay productos en estado crítico.</td></tr><tr th:each="producto : ${productos}"><td th:text="${producto.nombre}"></td><td th:text="${producto.categoriaNombre}"></td><td th:text="${'$ ' + producto.precio}"></td><td><span class="tag-status warning" th:text="${producto.stock}"></span></td></tr></tbody></table></div></section></main></div></body></html>
