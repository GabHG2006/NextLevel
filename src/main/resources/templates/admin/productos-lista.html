<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Productos admin</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css"><link rel="stylesheet" href="/css/style.css"></head><body class="admin-body"><div class="admin-layout"><div th:replace="~{fragments/admin-header :: adminSidebar('productos')}"></div><main class="admin-content"><div class="admin-toolbar"><div><h1 class="admin-page-title mb-1">Gestión de productos</h1><p class="admin-muted mb-0">Administra el catálogo manteniendo la interfaz clara y profesional.</p></div><div class="d-flex gap-2 flex-wrap"><a href="/admin/dashboard" class="btn store-btn-outline">Dashboard</a><a href="/admin/productos/nuevo" class="btn store-btn-primary">Nuevo producto</a></div></div><div th:if="${mensaje}" class="alert-soft alert-success mb-4" th:text="${mensaje}"></div><div th:if="${error}" class="alert-soft alert-danger mb-4" th:text="${error}"></div><section class="admin-card"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody><tr th:each="producto : ${productos}"><td th:text="${producto.id}"></td><td><strong th:text="${producto.nombre}"></strong><div class="admin-muted small" th:text="${producto.descripcion}"></div></td><td th:text="${producto.categoriaNombre}"></td><td th:text="${'$ ' + producto.precio}"></td><td><span class="tag-status" th:classappend="${producto.stock <= 5 ? ' warning' : ''}" th:text="${producto.stock}"></span></td><td><div class="inline-form"><a th:href="@{'/admin/productos/editar/' + ${producto.id}}" class="btn store-btn-secondary py-2 px-3">Editar</a><a th:href="@{'/admin/productos/eliminar/' + ${producto.id}}" class="btn store-btn-outline py-2 px-3">Eliminar</a></div></td></tr></tbody></table></div></section></main></div></body></html>
