<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mis pedidos</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css"><link rel="stylesheet" href="/css/style.css"></head><body class="store-body"><div th:replace="~{fragments/store-header :: storeHeader}"></div><main class="store-main"><div class="container"><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><h1 class="section-title mb-1">Mis pedidos</h1><p class="section-subtitle mb-0">Consulta el historial y el estado actual de cada pedido.</p></div><a href="/catalogo" class="btn store-btn-outline">Volver a la tienda</a></div><section th:if="${#lists.isEmpty(pedidos)}" class="empty-state-card text-center"><h2>Aún no tienes pedidos registrados</h2><p class="muted-copy">Cuando completes una compra, aquí podrás seguir el estado y el despacho.</p><a href="/catalogo" class="btn store-btn-primary mt-2">Explorar catálogo</a></section><section th:if="${!#lists.isEmpty(pedidos)}" class="order-item-list"><article class="order-card" th:each="pedido : ${pedidos}"><div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3"><div><span class="store-badge mb-2" th:text="${'Pedido #' + pedido.id}"></span><h2 class="mb-1">Resumen del pedido</h2><p class="muted-copy mb-0" th:text="${#temporals.format(pedido.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></p></div><div class="d-flex gap-2 flex-wrap"><span class="tag-status" th:text="${pedido.estado}"></span><span class="tag-status success" th:text="${pedido.estadoPago}"></span></div></div><div class="row g-4"><div class="col-lg-8"><div class="order-item-list"><article class="order-item" th:each="item : ${pedido.items}"><img th:src="${item.imagen}" th:alt="${item.nombreProducto}"><div><h3 class="order-title" th:text="${item.nombreProducto}"></h3><p class="cart-preview-meta" th:text="${item.cantidad + ' unidad(es)'}"></p><small class="text-muted" th:text="${item.categoriaNombre}"></small></div><strong th:text="${'$ ' + item.subtotal}"></strong></article></div></div><div class="col-lg-4"><div class="summary-box-note h-100"><p class="mb-2"><strong>Total:</strong> <span th:text="${'$ ' + pedido.total}"></span></p><p class="mb-2"><strong>Dirección:</strong> <span th:text="${pedido.direccionEnvio}"></span></p><p class="mb-2"><strong>Método:</strong> <span th:text="${pedido.metodoPagoTipo != null ? pedido.metodoPagoTipo + ' - ' + pedido.metodoPagoEntidad : 'Pendiente'}"></span></p><p class="mb-0"><strong>Tracking:</strong> <span th:text="${pedido.trackingCode != null ? pedido.trackingCode : 'Sin asignar'}"></span></p></div></div></div></article></section></div></main><script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script></body></html>
