spring.application.name=nextlevel-store-secure
server.port=${PORT:8081}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nextlevel_db?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}
spring.data.mongodb.auto-index-creation=true

spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

server.servlet.session.timeout=20m
server.servlet.session.cookie.name=NEXTLEVELSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.forward-headers-strategy=framework

server.error.whitelabel.enabled=false
server.error.path=/error
server.error.include-message=always
server.error.include-binding-errors=always

app.security.max-failed-attempts=5
app.security.lock-duration-minutes=15

app.jwt.secret=${JWT_SECRET:nextlevel-store-demo-jwt-secret-change-in-render-2026-very-long-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-secure=${APP_COOKIE_SECURE:true}
app.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}
app.jwt.cookie-max-age-seconds=${JWT_COOKIE_MAX_AGE_SECONDS:86400}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:demo-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:demo-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.org.springframework.security=INFO

app.powerbi.public-embed-url=${POWERBI_PUBLIC_EMBED_URL:https://app.powerbi.com/view?r=eyJrIjoiZjI0Mzk1NGEtYTEyOC00M2JiLWFhYzQtOTc0ZDY3ZjMyZjg5IiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9}
app.powerbi.embed-url=${POWERBI_EMBED_URL:}
app.powerbi.report-file=/powerbi/Taller.pbix
